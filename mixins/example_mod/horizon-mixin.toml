[mod]
id = "example_mod"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "example_mod"
source = "runtime.rs"

# The panel's drawing lives in the library crate: `ui_theme`'s widgets are
# crate-private there, and the game module is compiled into the binary crate.
[[module]]
id = "ui"
file = "crates/horizon-client/src/lib.rs"
name = "prism_ui"
source = "prism_ui.rs"
visibility = "pub"

# The bundled logo and icon PNGs as base64, decoded into the glyph atlas at
# run time. Packages only carry `.rs`/`.toml`, so raw images cannot ship.
[[module]]
id = "icons"
file = "crates/horizon-client/src/lib.rs"
name = "example_mod_icons"
source = "icons.rs"

[[injection]]
id = "before-break"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::break_block"
helper = "break.rs"
bindings = [{ name = "pos", ty = "[i32;3]", value = "pos" }]

[[injection]]
id = "gui-render"
kind = "RETURN"
target = "horizon_client::game::Game<'_>::hud"
helper = "gui_render.rs"
bindings = [
  { name = "batch", ty = "HudBatch", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "gui-input"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::<Game<'_> as ApplicationHandler>::window_event"
helper = "gui_input.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "event", ty = "&WindowEvent", value = "&event" },
  { name = "id", ty = "WindowId", value = "id" },
]
